name: Daily catalog update

on:
  schedule:
    # 01:17 UTC = 06:17 in Noyabrsk (UTC+05:00).
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Fetch, validate and publish changed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node update-catalog.mjs
