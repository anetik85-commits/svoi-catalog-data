name: Daily catalog update

on:
  schedule:
    # 01:17 UTC = 06:17 in Noyabrsk (UTC+05:00).
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch, validate and publish changed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node update-catalog.mjs
